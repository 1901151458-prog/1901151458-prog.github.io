name: Link check

on:
  schedule:
    - cron: '0 2 * * 1'   # 每周一 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check pages and external links
        run: python scripts/check_links.py
