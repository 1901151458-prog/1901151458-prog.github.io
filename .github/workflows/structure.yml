name: Structure check

on:
  push:
    paths:
      - 'root-site/**'
      - 'english-materials/**'
      - 'sishu/**'
      - 'web-vocab/**'
      - 'cefr-vocab/**'
      - 'deploy-web/**'
      - '.github/workflows/structure.yml'
  pull_request:
    paths:
      - 'root-site/**'
      - 'english-materials/**'
      - 'sishu/**'
      - 'web-vocab/**'
      - 'cefr-vocab/**'
      - 'deploy-web/**'
  schedule:
    - cron: '0 4 * * 1'   # 每周一 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Structure self-check
        run: python scripts/check_structure.py
