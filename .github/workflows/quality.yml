name: Quality check

on:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Screenshots + axe accessibility scan
        run: node scripts/quality-check.mjs
      - name: Lighthouse budgets
        if: always()
        run: npx @lhci/cli autorun --config=scripts/lighthouserc.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-artifacts
          path: artifacts/
          if-no-files-found: warn

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Restore visual baseline
        uses: actions/cache@v4
        with:
          path: visual-baseline
          key: visual-baseline-v1
      - name: Visual baseline / pixel regression
        run: node scripts/visual-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-artifacts
          path: artifacts/visual/
          if-no-files-found: warn
